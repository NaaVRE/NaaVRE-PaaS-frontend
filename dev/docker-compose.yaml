name: vrepaas-ui

services:

  app:
    image: "mcr.microsoft.com/devcontainers/javascript-node:1-20-bookworm"
    userns_mode: keep-id
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    ports:
      # catalogue service
      - '127.0.0.1:29800:29800'
      # catalogue s3
      - '127.0.0.1:29900:29900'
      - '127.0.0.1:29901:29901'
      # keycloak
      - '127.0.0.1:29801:29801'

  catalogue-service:
    image: ghcr.io/naavre/naavre-catalogue-service:v0.6.6
    network_mode: service:app
    volumes:
      - ./catalogue-fixtures.json:/code/app/fixtures.json
    environment:
      DEV_MODE: "true"
      VERIFY_SSL: false
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_PASSWORD: admin
      DJANGO_SUPERUSER_EMAIL: example@example.org
      PORT: 29800
      DB_HOST: catalogue-db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres-password
      DB_NAME: postgres
      S3_ENDPOINT_URL: http://localhost:29900
      S3_BUCKET_NAME: dev-bucket
      S3_ACCESS_KEY: fake-s3-access-key
      S3_SECRET_KEY: fake-s3-secret-key
      OIDC_CONFIGURATION_URL: http://keycloak:29801/realms/vre/.well-known/openid-configuration
      CORS_ALLOWED_ORIGIN_REGEXES: http://localhost:29300

  catalogue-db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres-password

  catalogue-s3:
    image: chrislusf/seaweedfs:4.51
    network_mode: service:app
    env_file:
      - catalogue-s3.env
    entrypoint: ["sh", "-e", "/catalogue-s3-entrypoint.sh"]
    volumes:
      - ./catalogue-s3-entrypoint.sh:/catalogue-s3-entrypoint.sh:ro
    healthcheck:
      # Healthy once the S3 API is up and the bucket has been created
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:29900/healthz && curl -fs -o /dev/null http://127.0.0.1:29902/buckets/$${BUCKET_NAME}/"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    network_mode: service:app
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 29801
    command:
      - start-dev
      - --hostname-strict=false
      - --import-realm
